{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="position-relative">

    <div class="bg-banner position-fixed top-0 start-0 z-0"></div>

    <div class="min-vh-100 d-flex align-items-center justify-content-center position-relative z-1 py-4">
        <div class="auth-wrapper">

            <div class="d-flex justify-content-between px-2 mb-2">
                <a href="{% url 'login' %}" class="tab-link inactive">Entrar</a>
                <a href="{% url 'cadastro' %}" class="tab-link active">Cadastrar</a>
            </div>

            <div class="auth-card shadow-sm">
                <h1 class="auth-title">Criar<br>conta:</h1>

                <form method="post">
                    {% csrf_token %}

                    {% if form %}
                        {% if form.non_field_errors %}
                            <div class="alert alert-danger p-2 small mb-3">
                                {% for error in form.non_field_errors %}
                                    <p class="m-0">{{ error }}</p>
                                {% endfor %}
                            </div>
                        {% endif %}

                        {{ form.as_p }}
                    {% else %}
                        <p>
                            <label for="id_nome">Nome:</label>
                            <input type="text" name="nome" id="id_nome" placeholder="Nome completo" required>
                        </p>
                        <p>
                            <label for="id_email">Email:</label>
                            <input type="email" name="email" id="id_email" placeholder="seuemail@exemplo.com" required>
                        </p>
                        <p>
                            <label for="id_telefone">Telefone:</label>
                            <input type="tel" name="telefone" id="id_telefone" placeholder="(11) 91234-5678">
                        </p>
                        <p>
                            <label for="id_senha">Senha:</label>
                            <input type="password" name="senha" id="id_senha" placeholder="********" required>
                        </p>
                    {% endif %}

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-custom">Continuar</button>
                    </div>
                </form>

                <div class="text-end mt-4">
                    <a href="#" class="help-link">Precisa de ajuda?</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
